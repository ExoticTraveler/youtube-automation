name: YouTube AutoDev GPT Review and Claude Routine Loop

# Trusted main only. Never checkout/execute untrusted PR code in this job.
# Unprivileged "YouTube Automation Offline Regression" runs tests separately.
on:
  issue_comment:
    types: [created]
  workflow_run:
    workflows: ["YouTube Automation Offline Regression"]
    types: [completed]
  workflow_dispatch:
  schedule:
    - cron: "41 */6 * * *"

permissions: {}
concurrency:
  group: youtube-autodev-review-loop
  cancel-in-progress: false

jobs:
  controller:
    if: >-
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 5 &&
       github.event.issue.pull_request &&
       github.event.comment.user.login == github.repository_owner &&
       github.event.comment.author_association == 'OWNER' &&
       startsWith(github.event.comment.body, 'YT-AUTODEV-START sha=')) ||
      (github.event_name == 'workflow_run' &&
       github.event.workflow_run.name == 'YouTube Automation Offline Regression' &&
       github.event.workflow_run.repository.full_name == github.repository) ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 9
    permissions:
      actions: read
      contents: read
      # PR timeline comment writes can require both scopes for a job token.
      pull-requests: write
      issues: write
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Trusted exact-head CI review and bounded Routine dispatch
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
        run: python3 tools/youtube_autodev_controller.py
