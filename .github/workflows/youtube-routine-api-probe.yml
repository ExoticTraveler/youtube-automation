name: YouTube Claude Routine one-shot API probe

# Completely separate from AutoDev review/repair: connectivity only.
# No API fire on PR/push/schedule/workflow_run events.
on:
  issue_comment:
    types: [created]

permissions: {}
concurrency:
  group: youtube-claude-one-shot-api-probe
  cancel-in-progress: false

jobs:
  probe:
    if: >-
      github.event.issue.number == 1 &&
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      github.event.comment.author_association == 'OWNER' &&
      github.event.comment.body == 'YT-AUTODEV-API-PROBE-V3 sha=3d0b82134c2298a78325e4b574231b0bccfd068a'
    runs-on: ubuntu-latest
    timeout-minutes: 4
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Checkout trusted main only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - name: Execute once, record one trusted receipt
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_EVENT_PATH: ${{ github.event_path }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          CLAUDE_ROUTINE_FIRE_URL: ${{ secrets.CLAUDE_ROUTINE_FIRE_URL }}
          CLAUDE_ROUTINE_FIRE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_FIRE_TOKEN }}
        run: python3 tools/youtube_routine_probe.py
